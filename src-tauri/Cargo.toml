[package]
name = "fxmp"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fxmp-core = { path = "../crates/core" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# The old app's login item is removed after the migration (see migrate.rs).
auto-launch = "0.6"
tauri-plugin-single-instance = "2"
souvlaki = "0.8.3"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# NSEvent.doubleClickInterval (tray double click).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# GetDoubleClickTime (tray double click).
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
keyring = "3"

[dev-dependencies]
tempfile = "3"
