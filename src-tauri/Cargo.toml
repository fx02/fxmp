[package]
name = "fxmp"
version = "0.1.5"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
# A library too: Android loads the app as a shared library.
name = "fxmp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
fxmp-core = { path = "../crates/core" }
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
tokio = { version = "1", features = ["sync"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"

# Desktop only: the tray, start at login, one instance, media keys.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
# The old app's login item is removed after the migration (see migrate.rs).
auto-launch = "0.6"
tauri-plugin-single-instance = "2"
souvlaki = "0.8.3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# NSEvent.doubleClickInterval (tray double click).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent"] }
# Whether the default input device is in use (mic.rs).
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# GetDoubleClickTime (tray double click).
windows-sys = { version = "0.60", features = ["Win32_UI_Input_KeyboardAndMouse"] }
# The microphone consent store (mic.rs).
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = "3"

[dev-dependencies]
tempfile = "3"
