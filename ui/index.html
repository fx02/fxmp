<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SMB Music Player</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<!-- Texts come from locales/<lang>.json: data-i18n sets the text, data-i18n-title,
     data-i18n-placeholder and data-i18n-aria-label set those attributes. -->

<header class="now">
  <div class="now-text">
    <div id="np-label" class="np-label" title="">—</div>
    <span id="np-genre" class="chip" hidden></span>
  </div>
  <div class="now-controls">
    <button id="btn-pause" class="icon" data-i18n-title="player.pause_resume" data-i18n-aria-label="player.pause_resume">⏯</button>
    <button id="btn-next" class="icon" data-i18n-title="player.next" data-i18n-aria-label="player.next">⏭</button>
    <button id="btn-ban" class="icon ban" data-i18n-title="player.ban" data-i18n-aria-label="player.ban_label">🚫</button>
    <input id="volume" class="volume" type="range" min="0" max="100" step="1" value="70" data-i18n-title="player.volume" data-i18n-aria-label="player.volume">
  </div>
</header>

<div class="status-row">
  <span id="conn-dot" class="dot"></span>
  <span id="conn-text" class="conn-text"></span>
</div>

<nav class="tabs" role="tablist">
  <button class="tab" data-tab="genres" role="tab" data-i18n="tabs.genres"></button>
  <button class="tab" data-tab="artists" role="tab" data-i18n="tabs.artists"></button>
  <button class="tab" data-tab="settings" role="tab" data-i18n="tabs.settings"></button>
</nav>

<main>
  <section id="tab-genres" class="panel" hidden>
    <div class="toolbar">
      <input id="genre-filter" type="search" data-i18n-placeholder="genres.filter" autocomplete="off" spellcheck="false">
      <button id="btn-play-selected" disabled></button>
      <button id="btn-play-all" data-i18n="genres.all"></button>
    </div>
    <div id="genre-scan" class="note" hidden></div>
    <ul id="genre-list" class="list"></ul>
    <p id="genre-empty" class="note" hidden></p>
  </section>

  <section id="tab-artists" class="panel" hidden>
    <div class="toolbar">
      <input id="artist-filter" type="search" data-i18n-placeholder="artists.search" autocomplete="off" spellcheck="false">
    </div>
    <ul id="artist-list" class="list"></ul>
    <p id="artist-note" class="note" hidden></p>
  </section>

  <section id="tab-settings" class="panel settings" hidden>
    <label class="field"><span data-i18n="settings.language"></span>
      <select id="language"></select>
    </label>

    <form id="servers-form" autocomplete="off">
      <fieldset data-server="primary">
        <legend data-i18n="settings.main_server"></legend>
        <label><span data-i18n="settings.server"></span> <input name="host" spellcheck="false"></label>
        <label><span data-i18n="settings.share"></span> <input name="share" spellcheck="false"></label>
        <label><span data-i18n="settings.path"></span> <input name="root" spellcheck="false"></label>
        <label><span data-i18n="settings.username"></span> <input name="username" spellcheck="false"></label>
        <label><span data-i18n="settings.password"></span> <input name="password" type="password" autocomplete="new-password"></label>
        <label><span data-i18n="settings.domain"></span> <input name="domain" data-i18n-placeholder="settings.optional" spellcheck="false"></label>
        <div class="row">
          <button type="button" class="btn-test" data-which="primary" data-i18n="settings.test"></button>
          <span class="test-result"></span>
        </div>
      </fieldset>

      <label class="check"><input id="use-secondary" type="checkbox"> <span data-i18n="settings.backup_server"></span></label>
      <fieldset data-server="secondary" hidden>
        <legend data-i18n="settings.backup_server"></legend>
        <label><span data-i18n="settings.server"></span> <input name="host" spellcheck="false"></label>
        <label><span data-i18n="settings.share"></span> <input name="share" spellcheck="false"></label>
        <label><span data-i18n="settings.path"></span> <input name="root" spellcheck="false"></label>
        <label><span data-i18n="settings.username"></span> <input name="username" spellcheck="false"></label>
        <label><span data-i18n="settings.password"></span> <input name="password" type="password" autocomplete="new-password"></label>
        <label><span data-i18n="settings.domain"></span> <input name="domain" data-i18n-placeholder="settings.optional" spellcheck="false"></label>
        <div class="row">
          <button type="button" class="btn-test" data-which="secondary" data-i18n="settings.test"></button>
          <span class="test-result"></span>
        </div>
      </fieldset>

      <label class="check"><input id="notify" type="checkbox"> <span data-i18n="settings.notify"></span></label>
      <label class="check"><input id="autostart" type="checkbox"> <span data-i18n="settings.autostart"></span></label>

      <div class="row">
        <button type="submit" class="primary" data-i18n="settings.save"></button>
        <span id="save-result" class="result"></span>
      </div>
    </form>

    <h3 data-i18n="settings.playback"></h3>
    <label class="field"><span data-i18n="settings.device"></span>
      <select id="device"></select>
    </label>
    <label class="check"><input id="crossfade-on" type="checkbox"> <span data-i18n="settings.crossfade"></span></label>
    <label class="field slider-field">
      <input id="crossfade-secs" type="range" min="1" max="10" step="1" value="5" data-i18n-aria-label="settings.crossfade_length">
      <span id="crossfade-label"></span>
    </label>
    <label class="check"><input id="normalize" type="checkbox"> <span data-i18n="settings.normalize"></span></label>

    <h3 data-i18n="settings.library"></h3>
    <div class="row">
      <button id="btn-scan" data-i18n="settings.refresh"></button>
      <button id="btn-scan-cancel" hidden data-i18n="common.cancel"></button>
    </div>
    <p id="scan-status" class="note"></p>

    <h3 data-i18n="settings.banned"></h3>
    <ul id="banned-list" class="list compact"></ul>
    <p id="banned-empty" class="note" hidden data-i18n="settings.no_banned"></p>
  </section>
</main>

<div id="menu" class="menu" hidden>
  <button data-action="merge" data-i18n="genres.merge_into"></button>
</div>

<div id="dialog" class="overlay" hidden>
  <form id="dialog-form" class="dialog">
    <p id="dialog-title"></p>
    <input id="dialog-filter" type="search" data-i18n-placeholder="genres.filter" data-i18n-aria-label="genres.filter" autocomplete="off" spellcheck="false">
    <select id="dialog-choices" size="10" data-i18n-aria-label="merge.list"></select>
    <div class="row end">
      <button type="button" id="dialog-cancel" data-i18n="common.cancel"></button>
      <button type="submit" class="primary" data-i18n="merge.button"></button>
    </div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
</body>
</html>
