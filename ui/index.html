<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fxmp</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<!-- Texts come from locales/<lang>.json: data-i18n sets the text, data-i18n-title,
     data-i18n-placeholder and data-i18n-aria-label set those attributes. -->

<header class="now">
  <div class="now-text">
    <button id="np-label" class="np-label" type="button" title="">—</button>
    <span id="np-genre" class="chip" hidden></span>
  </div>
  <div id="np-progress" class="np-progress" hidden>
    <div class="np-bar"><div id="np-fill" class="np-fill"></div></div>
    <span id="np-time" class="np-time"></span>
  </div>
  <div class="now-controls">
    <button id="btn-prev" class="icon" data-i18n-title="player.previous" data-i18n-aria-label="player.previous">⏮</button>
    <button id="btn-pause" class="icon" data-i18n-title="player.pause_resume" data-i18n-aria-label="player.pause_resume">⏯</button>
    <button id="btn-next" class="icon" data-i18n-title="player.next" data-i18n-aria-label="player.next">⏭</button>
    <button id="btn-ban" class="icon ban" data-i18n-title="player.ban" data-i18n-aria-label="player.ban_label">🚫</button>
    <input id="volume" class="volume" type="range" min="0" max="100" step="1" value="70" data-i18n-title="player.volume" data-i18n-aria-label="player.volume">
  </div>
</header>

<div class="status-row">
  <span id="conn-dot" class="dot"></span>
  <span id="conn-text" class="conn-text"></span>
</div>

<nav class="tabs" role="tablist">
  <button class="tab" data-tab="genres" role="tab" data-i18n="tabs.genres"></button>
  <button class="tab" data-tab="playlist" role="tab" data-i18n="tabs.playlist"></button>
  <button class="tab" data-tab="artists" role="tab" data-i18n="tabs.artists"></button>
  <button class="tab" data-tab="unreadable" role="tab" id="tab-btn-unreadable"></button>
  <button class="tab" data-tab="settings" role="tab" data-i18n="tabs.settings"></button>
</nav>

<main>
  <section id="tab-genres" class="panel" hidden>
    <div class="toolbar">
      <input id="genre-filter" type="search" data-i18n-placeholder="genres.filter" autocomplete="off" spellcheck="false">
      <button id="btn-play-selected" disabled></button>
      <button id="btn-play-all" data-i18n="genres.all"></button>
    </div>
    <div id="genre-scan" class="note" hidden></div>
    <ul id="genre-list" class="list"></ul>
    <p id="genre-empty" class="note" hidden></p>
    <button id="btn-empty-scan" hidden data-i18n="settings.refresh"></button>
  </section>

  <section id="tab-playlist" class="panel" hidden>
    <div class="toolbar">
      <input id="pl-filter" type="search" data-i18n-placeholder="playlist.filter" data-i18n-aria-label="playlist.filter" autocomplete="off" spellcheck="false">
      <button id="pl-current" class="icon" data-i18n-title="playlist.show_current" data-i18n-aria-label="playlist.show_current">◎</button>
    </div>
    <div class="pl-filters">
      <details id="pl-genres" class="dropdown">
        <summary id="pl-genres-label"></summary>
        <div id="pl-genre-list" class="dropdown-list"></div>
      </details>
      <select id="pl-year-from" data-i18n-aria-label="playlist.year_from"></select>
      <span class="dash">–</span>
      <select id="pl-year-to" data-i18n-aria-label="playlist.year_to"></select>
      <label class="check"><input id="pl-unknown-year" type="checkbox"> <span data-i18n="playlist.unknown_year"></span></label>
    </div>
    <div class="pl-head">
      <span id="pl-title" class="pl-title"></span>
      <span id="pl-count" class="pl-count"></span>
    </div>
    <div class="pl-actions">
      <button id="pl-play-filtered" data-i18n="playlist.play_filtered" disabled></button>
      <button id="pl-export" data-i18n="playlist.export"></button>
      <button id="pl-new" data-i18n="playlist.new"></button>
    </div>
    <p class="note" data-i18n="playlist.manual_hint"></p>
    <div id="pl-list" class="pl-list" role="list"></div>
    <p id="pl-empty" class="note" hidden></p>
  </section>

  <section id="tab-artists" class="panel" hidden>
    <div class="toolbar">
      <input id="artist-filter" type="search" data-i18n-placeholder="artists.search" autocomplete="off" spellcheck="false">
    </div>
    <ul id="artist-list" class="list"></ul>
    <p id="artist-note" class="note" hidden></p>
  </section>

  <section id="tab-unreadable" class="panel" hidden>
    <div class="toolbar">
      <button id="btn-copy-all" data-i18n="unreadable.copy_all"></button>
      <button id="btn-retry-all" data-i18n="unreadable.retry_all"></button>
    </div>
    <p class="note" data-i18n="unreadable.hint"></p>
    <ul id="unreadable-list" class="list unreadable"></ul>
    <p id="unreadable-empty" class="note" hidden data-i18n="unreadable.empty"></p>
  </section>

  <section id="tab-settings" class="panel settings" hidden>
    <label class="field"><span data-i18n="settings.language"></span>
      <select id="language"></select>
    </label>

    <form id="servers-form" autocomplete="off">
      <fieldset data-server="primary">
        <legend data-i18n="settings.main_server"></legend>
        <label class="check"><input name="enabled" type="checkbox" checked> <span data-i18n="settings.server_on"></span></label>
        <label><span data-i18n="settings.server"></span> <input name="host" data-i18n-placeholder="settings.host_example" spellcheck="false"></label>
        <label><span data-i18n="settings.share"></span> <input name="share" data-i18n-placeholder="settings.share_example" spellcheck="false"></label>
        <label><span data-i18n="settings.path"></span> <input name="root" data-i18n-placeholder="settings.root_example" spellcheck="false"></label>
        <label><span data-i18n="settings.username"></span> <input name="username" spellcheck="false"></label>
        <label><span data-i18n="settings.password"></span> <input name="password" type="password" autocomplete="new-password"></label>
        <label><span data-i18n="settings.domain"></span> <input name="domain" data-i18n-placeholder="settings.optional" spellcheck="false"></label>
        <div class="row">
          <button type="button" class="btn-test" data-which="primary" data-i18n="settings.test"></button>
          <span class="test-result"></span>
        </div>
      </fieldset>

      <label class="check"><input id="use-secondary" type="checkbox"> <span data-i18n="settings.backup_server"></span></label>
      <fieldset data-server="secondary" hidden>
        <legend data-i18n="settings.backup_server"></legend>
        <label class="check"><input name="enabled" type="checkbox" checked> <span data-i18n="settings.server_on"></span></label>
        <label><span data-i18n="settings.server"></span> <input name="host" data-i18n-placeholder="settings.host_example" spellcheck="false"></label>
        <label><span data-i18n="settings.share"></span> <input name="share" data-i18n-placeholder="settings.share_example" spellcheck="false"></label>
        <label><span data-i18n="settings.path"></span> <input name="root" data-i18n-placeholder="settings.root_example" spellcheck="false"></label>
        <label><span data-i18n="settings.username"></span> <input name="username" spellcheck="false"></label>
        <label><span data-i18n="settings.password"></span> <input name="password" type="password" autocomplete="new-password"></label>
        <label><span data-i18n="settings.domain"></span> <input name="domain" data-i18n-placeholder="settings.optional" spellcheck="false"></label>
        <div class="row">
          <button type="button" class="btn-test" data-which="secondary" data-i18n="settings.test"></button>
          <span class="test-result"></span>
        </div>
      </fieldset>

      <label class="check"><input id="notify" type="checkbox"> <span data-i18n="settings.notify"></span></label>
      <label class="check"><input id="autostart" type="checkbox"> <span data-i18n="settings.autostart"></span></label>

      <div class="row">
        <button type="submit" class="primary" data-i18n="settings.save"></button>
        <span id="save-result" class="result"></span>
      </div>
    </form>

    <h3 data-i18n="libraries.title"></h3>
    <p class="note" data-i18n="libraries.note"></p>
    <ul id="libraries-list" class="list libraries"></ul>
    <div class="row">
      <button id="btn-add-smb" type="button" data-i18n="libraries.add_smb"></button>
      <button id="btn-add-local" type="button" data-i18n="libraries.add_local"></button>
    </div>
    <form id="library-form" class="library-form" autocomplete="off" hidden>
      <h4 id="library-form-title"></h4>
      <label class="field"><span data-i18n="libraries.name"></span>
        <input name="name" data-i18n-placeholder="settings.optional" spellcheck="false">
      </label>
      <div id="library-local">
        <label class="field"><span data-i18n="libraries.folder"></span>
          <input name="path" spellcheck="false">
        </label>
        <div class="row">
          <button type="button" id="btn-choose-folder" data-i18n="libraries.choose_folder"></button>
          <button type="button" id="btn-test-folder" data-i18n="libraries.test_folder"></button>
          <span id="folder-result" class="test-result"></span>
        </div>
      </div>
      <div id="library-smb">
        <fieldset data-libserver="primary">
          <legend data-i18n="settings.main_server"></legend>
          <label class="check"><input name="enabled" type="checkbox" checked> <span data-i18n="settings.server_on"></span></label>
          <label><span data-i18n="settings.server"></span> <input name="host" data-i18n-placeholder="settings.host_example" spellcheck="false"></label>
          <label><span data-i18n="settings.share"></span> <input name="share" data-i18n-placeholder="settings.share_example" spellcheck="false"></label>
          <label><span data-i18n="settings.path"></span> <input name="root" data-i18n-placeholder="settings.root_example" spellcheck="false"></label>
          <label><span data-i18n="settings.username"></span> <input name="username" spellcheck="false"></label>
          <label><span data-i18n="settings.password"></span> <input name="password" type="password" autocomplete="new-password"></label>
          <label><span data-i18n="settings.domain"></span> <input name="domain" data-i18n-placeholder="settings.optional" spellcheck="false"></label>
          <div class="row">
            <button type="button" class="btn-lib-test" data-which="primary" data-i18n="settings.test"></button>
            <span class="test-result"></span>
          </div>
        </fieldset>
        <label class="check"><input id="lib-use-secondary" type="checkbox"> <span data-i18n="settings.backup_server"></span></label>
        <fieldset data-libserver="secondary" hidden>
          <legend data-i18n="settings.backup_server"></legend>
          <label class="check"><input name="enabled" type="checkbox" checked> <span data-i18n="settings.server_on"></span></label>
          <label><span data-i18n="settings.server"></span> <input name="host" data-i18n-placeholder="settings.host_example" spellcheck="false"></label>
          <label><span data-i18n="settings.share"></span> <input name="share" data-i18n-placeholder="settings.share_example" spellcheck="false"></label>
          <label><span data-i18n="settings.path"></span> <input name="root" data-i18n-placeholder="settings.root_example" spellcheck="false"></label>
          <label><span data-i18n="settings.username"></span> <input name="username" spellcheck="false"></label>
          <label><span data-i18n="settings.password"></span> <input name="password" type="password" autocomplete="new-password"></label>
          <label><span data-i18n="settings.domain"></span> <input name="domain" data-i18n-placeholder="settings.optional" spellcheck="false"></label>
          <div class="row">
            <button type="button" class="btn-lib-test" data-which="secondary" data-i18n="settings.test"></button>
            <span class="test-result"></span>
          </div>
        </fieldset>
      </div>
      <p id="library-main-note" class="note" hidden data-i18n="libraries.main_note"></p>
      <label class="check"><input name="enabled" type="checkbox"> <span data-i18n="libraries.enabled"></span></label>
      <div class="row">
        <button type="submit" class="primary" data-i18n="settings.save"></button>
        <button type="button" id="btn-library-cancel" data-i18n="common.cancel"></button>
        <span id="library-result" class="result"></span>
      </div>
    </form>

    <h3 data-i18n="settings.playback"></h3>
    <label class="field"><span data-i18n="settings.device"></span>
      <select id="device"></select>
    </label>
    <label class="check"><input id="crossfade-on" type="checkbox"> <span data-i18n="settings.crossfade"></span></label>
    <label class="field slider-field">
      <input id="crossfade-secs" type="range" min="1" max="10" step="1" value="5" data-i18n-aria-label="settings.crossfade_length">
      <span id="crossfade-label"></span>
    </label>
    <label class="check"><input id="normalize" type="checkbox"> <span data-i18n="settings.normalize"></span></label>
    <label class="check"><input id="resume-autoplay" type="checkbox"> <span data-i18n="settings.resume_autoplay"></span></label>
    <label class="field"><span data-i18n="settings.lookup_service"></span>
      <select id="lookup-service"></select>
    </label>

    <h3 data-i18n="settings.library"></h3>
    <div class="row">
      <button id="btn-scan" data-i18n="settings.refresh"></button>
      <button id="btn-scan-cancel" hidden data-i18n="common.cancel"></button>
    </div>
    <p id="scan-status" class="note"></p>

    <h3 data-i18n="settings.banned"></h3>
    <ul id="banned-list" class="list compact"></ul>
    <p id="banned-empty" class="note" hidden data-i18n="settings.no_banned"></p>

    <h3 class="danger-title" data-i18n="settings.danger"></h3>
    <div class="danger-zone">
      <button id="btn-reset" class="danger" data-i18n="settings.reset"></button>
      <button id="btn-clear" class="danger" data-i18n="settings.clear"></button>
    </div>

    <h3 data-i18n="settings.about"></h3>
    <div class="about">
      <p id="about-name" class="about-name"></p>
      <p class="note" data-i18n="about.long_name"></p>
      <p id="about-version" class="note"></p>
      <p id="about-build" class="note"></p>
      <p class="note" data-i18n="about.vibe"></p>
      <div class="row">
        <button id="btn-github" class="link" data-i18n="about.github"></button>
        <button id="btn-copy-version" data-i18n="about.copy_version"></button>
      </div>
      <p class="note" data-i18n="about.version_hint"></p>
    </div>
  </section>
</main>

<div id="menu" class="menu" hidden>
  <button data-action="merge" data-i18n="genres.merge_into"></button>
</div>

<div id="ctx" class="menu ctx" role="menu" hidden></div>

<div id="dialog" class="overlay" hidden>
  <form id="dialog-form" class="dialog">
    <p id="dialog-title"></p>
    <input id="dialog-filter" type="search" data-i18n-placeholder="genres.filter" data-i18n-aria-label="genres.filter" autocomplete="off" spellcheck="false">
    <select id="dialog-choices" size="10" data-i18n-aria-label="merge.list"></select>
    <div class="row end">
      <button type="button" id="dialog-cancel" data-i18n="common.cancel"></button>
      <button type="submit" class="primary" data-i18n="merge.button"></button>
    </div>
  </form>
</div>

<div id="confirm" class="overlay" hidden>
  <form id="confirm-form" class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <p id="confirm-title" class="dialog-title"></p>
    <p id="confirm-text"></p>
    <label id="confirm-check-row" class="check" hidden><input id="confirm-check" type="checkbox"> <span id="confirm-check-label"></span></label>
    <p id="confirm-note" class="note" hidden></p>
    <div class="row end">
      <button type="button" id="confirm-cancel" data-i18n="common.cancel"></button>
      <button type="submit" id="confirm-ok" class="danger-solid"></button>
    </div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
</body>
</html>
